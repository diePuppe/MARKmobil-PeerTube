version: "3.9"
# =============================================================
# Plausible Analytics – self-hosted
# Run this from /plausible/ directory OR integrate into
# the root docker-compose.yml (services are already included there).
# This file is kept here as a standalone reference / dev environment.
# =============================================================

services:
  plausible_db:
    image: clickhouse/clickhouse-server:23.3-alpine
    container_name: plausible_clickhouse
    restart: unless-stopped
    volumes:
      - plausible_clickhouse:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  plausible_postgres:
    image: postgres:15-alpine
    container_name: plausible_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PLAUSIBLE_DB_USERNAME:-plausible}
      - POSTGRES_PASSWORD=${PLAUSIBLE_DB_PASSWORD:-changeme}
      - POSTGRES_DB=plausible_db
    volumes:
      - plausible_postgres:/var/lib/postgresql/data

  plausible:
    image: ghcr.io/plausible/community-edition:v2.1
    container_name: plausible
    restart: unless-stopped
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    ports:
      - "127.0.0.1:8000:8000"   # only accessible via Nginx proxy
    environment:
      - BASE_URL=https://${PLAUSIBLE_DOMAIN:-stats.your-domain.example.com}
      - SECRET_KEY_BASE=${PLAUSIBLE_SECRET_KEY_BASE:-change_me}
      - DATABASE_URL=postgres://${PLAUSIBLE_DB_USERNAME:-plausible}:${PLAUSIBLE_DB_PASSWORD:-changeme}@plausible_postgres:5432/plausible_db
      - CLICKHOUSE_DATABASE_URL=http://plausible_db:8123/plausible_events_db
      - DISABLE_REGISTRATION=true
    depends_on:
      - plausible_db
      - plausible_postgres

volumes:
  plausible_clickhouse:
  plausible_postgres:
