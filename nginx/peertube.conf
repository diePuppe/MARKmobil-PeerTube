# ==============================================================
# Markmobil – Nginx Reverse Proxy Configuration
# ==============================================================
# Replace YOUR_DOMAIN with your actual domain name.
# SSL certificates are managed by the certbot container.
# ==============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ----------------------------------------------------------
    # SSL Certificates (Let's Encrypt via Certbot)
    # ----------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

    # Modern SSL settings
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # HSTS (6 months)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # ----------------------------------------------------------
    # Security Headers
    # ----------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-Frame-Options           "SAMEORIGIN"      always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # No analytics cookies, no cross-site embeds needed
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ----------------------------------------------------------
    # Logging – auto-delete after 24 h via logrotate (see README)
    # ----------------------------------------------------------
    access_log /var/log/nginx/peertube_access.log;
    error_log  /var/log/nginx/peertube_error.log;

    # ----------------------------------------------------------
    # Upload size (large video files)
    # ----------------------------------------------------------
    client_max_body_size 10G;
    client_body_timeout  600s;

    # ----------------------------------------------------------
    # Proxy to PeerTube
    # ----------------------------------------------------------
    location / {
        proxy_pass         http://peertube:9000;
        proxy_http_version 1.1;

        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  https;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";

        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 30s;

        proxy_buffering    off;
    }

    # WebSocket for live / HLS
    location /socket.io {
        proxy_pass         http://peertube:9000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade   $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host      $host;
    }

    # Static video files served directly from volume for performance
    # (When CDN is added later, point this to Bunny.net pull zone)
    location /static/ {
        alias /data/;
        add_header Cache-Control "public, max-age=86400";
    }
}

# ----------------------------------------------------------
# Plausible Analytics – separate subdomain
# ----------------------------------------------------------
server {
    listen 80;
    server_name stats.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name stats.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/stats.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1M;

    location / {
        proxy_pass        http://plausible:8000;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto https;
    }
}
